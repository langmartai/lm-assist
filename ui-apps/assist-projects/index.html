<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assist — Projects</title>
<!-- Relative refs only: the same document is served from the hub gateway AND the local
     tier under different path roots, so a leading-slash href would break under one of them. -->
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<header>
  <h1>Projects<span class="chip">assist-projects</span><span class="chip">scope: lm-assist</span></h1>
  <div id="who"><span class="dot"></span><span id="who-name">…</span></div>
</header>
<main>
  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="projects">Projects</button>
    <button class="tab" data-tab="processes">Processes</button>
    <span id="node" class="node"></span>
  </div>

  <!-- How this pane was ENTERED: what an inbound ?project= / ?session= / ?tab= / ?q= did, and
       what it could not do. Hidden when the pane was opened without params. -->
  <div id="nav-note" class="navnote" hidden></div>

  <!-- ── Projects view ────────────────────────────────────────────────────── -->
  <div class="cols" id="view-projects">
    <section class="pane pane-list">
      <div class="filters">
        <input id="q" class="q" type="text" placeholder="filter name / path / branch / remote…" autocomplete="off">
        <div class="chip-row"><span class="chip-lbl">show</span><span id="chips-git" class="chips"></span></div>
        <div class="chip-row"><span class="chip-lbl">sort</span>
          <select id="sort" class="sel">
            <option value="activity">last activity</option>
            <option value="sessions">session count</option>
            <option value="cost">total cost</option>
            <option value="size">storage size</option>
            <option value="name">name</option>
          </select>
          <button id="btn-reload" class="ghost sm">Refresh</button>
        </div>
      </div>
      <div id="list" class="list">loading…</div>
      <div id="counts" class="counts"></div>
    </section>

    <section class="pane pane-detail">
      <div id="detail" class="detail empty">Select a project on the left to see its git state, worktrees, remotes, storage and last prompt.</div>
    </section>
  </div>

  <!-- ── Processes view (the folded-in process dashboard) ──────────────────── -->
  <div class="stack" id="view-processes" hidden>
    <section class="pane">
      <div id="p-stats" class="stats">loading…</div>
      <div class="pcontrols">
        <input id="pq" class="q" type="text" placeholder="filter pid / session / project / tmux / cmdline…" autocomplete="off">
        <label class="chk"><input type="checkbox" id="auto" checked> auto-refresh 5s</label>
        <label class="chk"><input type="checkbox" id="rich"> rich session detail <span class="hint">(heavy)</span></label>
        <button id="btn-proc-refresh" class="ghost sm">Refresh</button>
        <button id="btn-killall" class="ghost sm danger">Close all</button>
      </div>
      <div id="p-meta" class="pmeta"></div>
      <!-- The visible reason the per-row Open ↗ / Connect ↗ buttons are disabled. -->
      <div id="p-why" class="why"></div>
    </section>

    <div id="p-list" class="groups">loading…</div>
    <div id="p-counts" class="counts"></div>
  </div>

  <div id="out" class="out">ready</div>
</main>
<!-- The serving tier injects window.__VIEW_TOKEN__ / __UI_ID__ / __UI_KEY__ before these
     scripts run; lmui.js captures them, app.js drives the UI. Both are self-hosted (CSP). -->
<script src="assets/lmui.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
