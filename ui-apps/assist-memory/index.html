<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assist — Memory &amp; Rules</title>
<!-- Relative refs only: the same document is served from the hub gateway AND the local
     tier under different path roots, so a leading-slash href would break under one of them. -->
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<header>
  <h1>Memory &amp; Rules<span class="chip">assist-memory</span><span class="chip">scope: lm-assist</span></h1>
  <div id="who"><span class="dot"></span><span id="who-name">…</span></div>
</header>
<main>
  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="memory">Memory</button>
    <button class="tab" data-tab="rules">Rules</button>
  </div>

  <div class="cols">
    <section class="pane pane-list">
      <div class="filters">
        <!-- Memory-only: which project's memory dir to browse. -->
        <label class="fld tab-memory" id="proj-wrap">Project
          <select id="proj"></select>
        </label>
        <input id="q" class="q" type="text" placeholder="filter files…" autocomplete="off">
        <div class="hint" id="list-hint"></div>
      </div>
      <div id="list" class="list">loading…</div>
      <div id="counts" class="counts"></div>
    </section>

    <section class="pane pane-detail">
      <div id="detail" class="detail empty">Select a file on the left to read its content and metadata.</div>
    </section>
  </div>
</main>
<!-- The serving tier injects window.__VIEW_TOKEN__ / __UI_ID__ / __UI_KEY__ before these
     scripts run; lmui.js captures them, app.js drives the UI. Both are self-hosted (CSP). -->
<script src="assets/lmui.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
