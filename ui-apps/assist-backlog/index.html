<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assist — Backlog</title>
<!-- Relative refs only: the same document is served from the hub gateway AND the local
     tier under different path roots, so a leading-slash href would break under one of them. -->
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<header>
  <h1>Backlog<span class="chip">assist-backlog</span><span class="chip">scope: lm-assist</span></h1>
  <div id="who"><span class="dot"></span><span id="who-name">…</span></div>
</header>
<nav class="tabs" id="tabs">
  <button id="tab-list" class="tab on" type="button">List</button>
  <button id="tab-graph" class="tab" type="button">Graph</button>
</nav>
<main>
  <section class="pane pane-graph" id="graph-pane" hidden>
    <div class="g-toolbar">
      <span id="g-stats" class="g-stats">…</span>
      <label class="chk"><input type="checkbox" id="g-removed" autocomplete="off"> include removed</label>
      <select id="g-strategy" class="g-sel" autocomplete="off" title="Hubs: most-connected item centered per group. Clusters: left-to-right dependency flow.">
        <option value="hubs">Hubs</option>
        <option value="clusters">Clusters</option>
      </select>
      <span class="g-sp"></span>
      <button id="g-zoom-out" class="ghost" type="button" title="Zoom out">−</button>
      <span id="g-zoom-pct" class="g-stats">100%</span>
      <button id="g-zoom-in" class="ghost" type="button" title="Zoom in">+</button>
      <button id="g-fit" class="ghost" type="button" title="Fit — or double-click the canvas">fit</button>
      <button id="g-refresh" class="ghost" type="button">refresh</button>
    </div>
    <!-- House graph pattern (assist-mission-graph): absolutely-positioned cards over an
         SVG edge layer inside ONE transformed stage — pan/zoom is a CSS transform. -->
    <div id="g-canvas" class="g-canvas">
      <div id="g-stage" class="g-stage">
        <svg id="g-edges" class="g-edges" width="0" height="0"><defs id="g-defs"></defs><g id="g-edge-g"></g></svg>
        <div id="g-cards" class="g-cards"></div>
      </div>
      <div id="g-msg" class="g-msg" hidden></div>
      <div id="g-card" class="g-card" hidden></div>
      <div id="g-legend" class="g-legend"></div>
    </div>
  </section>

  <section class="pane pane-list">
    <div class="filters">
      <input id="q" class="q" type="text" placeholder="filter title / id / tag…" autocomplete="off">
      <div class="chip-row"><span class="chip-lbl">status</span><span id="chips-status" class="chips"></span></div>
      <div class="chip-row"><span class="chip-lbl">type</span><span id="chips-type" class="chips"></span></div>
      <label class="chk"><input type="checkbox" id="show-removed" autocomplete="off"> include removed</label>
    </div>
    <div id="list" class="list">loading…</div>
    <div id="counts" class="counts"></div>
  </section>

  <section class="pane pane-detail">
    <div id="detail" class="detail empty">Select an item on the left, or fill the form to create one.</div>
  </section>

  <section class="pane pane-form">
    <div class="form-head">
      <h2 id="form-title">New item</h2>
      <button id="form-new" class="ghost" hidden>+ new</button>
    </div>
    <form id="form" autocomplete="off">
      <label class="fld">Title
        <input id="f-title" type="text" maxlength="300" required>
      </label>
      <label class="fld">Description <span class="hint">markdown, shown as plain text</span>
        <textarea id="f-desc" rows="5"></textarea>
      </label>
      <div class="row3">
        <label class="fld">Type<select id="f-type"></select></label>
        <label class="fld">Priority<select id="f-priority"></select></label>
        <label class="fld">Status<select id="f-status"></select></label>
      </div>
      <div class="actions"><button id="f-submit" type="submit" class="primary">Create</button></div>
    </form>

    <div class="note-box">
      <h2>Discussion note <span id="note-target" class="hint">no item selected</span></h2>
      <textarea id="n-note" rows="3" maxlength="4000" placeholder="Add a note to the selected item…"></textarea>
      <button id="n-add" class="ghost">Add note</button>
    </div>

    <div id="out" class="out">ready</div>
  </section>
</main>
<!-- The serving tier injects window.__VIEW_TOKEN__ / __UI_ID__ / __UI_KEY__ before these
     scripts run; lmui.js captures them, app.js drives the UI. Both are self-hosted (CSP). -->
<script src="assets/lmui.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
