<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 882" role="img" aria-label="lm-assist capability map: four doors into one Core API and its fleet — the MCP connector (the main door), the Web UI, the Claude Code skills plugin, and the Core's own REST API for systems; the MCP door groups core Claude features apart from extended beyond-Claude tools">
  <title>lm-assist capability map — four doors, one control plane</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="882" fill="#ffffff"/>

  <!-- heading -->
  <text x="640" y="34" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#0f172a">One control plane, four doors — pick the door that fits the moment</text>

  <!-- actors -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#334155" text-anchor="middle">
    <text x="240" y="66">🧑 you, in a browser — any device, anywhere</text>
    <text x="640" y="58" font-weight="700" fill="#047857">🤖 Claude working for you — the main use case</text>
    <text x="640" y="76" font-size="12.5">💬 claude.ai conversation · 👥 Cowork session · 🖥️ Claude Code, local or remote (CCR)</text>
    <text x="1040" y="66">⌨️ you, in the Claude Code terminal</text>
  </g>
  <g stroke="#475569" stroke-width="1.4">
    <line x1="240" y1="74" x2="240" y2="92" marker-end="url(#arrow)"/>
    <line x1="640" y1="81" x2="640" y2="92" marker-end="url(#arrow)"/>
    <line x1="1040" y1="74" x2="1040" y2="92" marker-end="url(#arrow)"/>
  </g>

  <!-- ───────────────── Web UI card ───────────────── -->
  <rect x="40" y="96" width="400" height="460" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="64" y="130" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">🖥️ Web UI</text>
  <text x="64" y="150" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">watch and drive everything visually · :3848</text>
  <line x1="64" y1="162" x2="416" y2="162" stroke="#bfdbfe" stroke-width="1"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0f172a">
    <text x="64" y="188">📊 sessions browser — 15 insight views</text>
    <text x="64" y="215">🕹️ live web terminal (ttyd)</text>
    <text x="64" y="242">🧭 missions dashboard + graph</text>
    <text x="64" y="269">💡 backlog graph — ideas · issues · bugs</text>
    <text x="64" y="296">🧠 memory &amp; rules pages</text>
    <text x="64" y="323">🛰️ CCR remote — claude.ai/code parity</text>
    <text x="64" y="350">⏰ scheduler jobs</text>
    <text x="64" y="377">🔧 MCP tool registry — override / on-off</text>
    <text x="64" y="404">🔍 prompt search (bm25, CJK-aware)</text>
    <text x="64" y="431">📋 tasks kanban · 🗃️ projects</text>
    <text x="64" y="458">⚙️ settings — connection · LAN · experiments</text>
  </g>

  <!-- ───────────────── MCP card ───────────────── -->
  <rect x="464" y="96" width="400" height="460" rx="12" fill="#f0fdf4" stroke="#10b981" stroke-width="3"/>
  <rect x="744" y="108" width="104" height="24" rx="12" fill="#10b981"/>
  <text x="796" y="124" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff">★ main door</text>
  <text x="488" y="130" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#047857">🔌 MCP connector</text>
  <text x="488" y="150" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">280+ tools Claude can call for you, fleet-wide</text>
  <line x1="488" y1="162" x2="840" y2="162" stroke="#a7f3d0" stroke-width="1"/>
  <text x="488" y="182" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#047857" letter-spacing="1.2">CORE — EVERYTHING CLAUDE</text>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0f172a">
    <text x="488" y="206">🚀 bootstrap + guide — self-teaching surface</text>
    <text x="488" y="233" font-weight="700">🗂️ sessions — local · remote (CCR) · cloud</text>
    <text x="488" y="260" font-weight="700">🌐 claude.ai conversations — read · rename · fork</text>
    <text x="488" y="287" font-weight="700">🧠 memory &amp; rules — every project, every node</text>
    <text x="488" y="314" font-weight="700">🧭 missions · workflows · backlog — self-driving</text>
    <text x="488" y="341" font-weight="700">🪟 UI panes — hand you a live dashboard URL</text>
    <text x="488" y="368">💾 backups · 🔍 fleet search · ⏱️ usage &amp; limits</text>
    <text x="488" y="395">🕹️ terminal driving · 🎙️ claude.ai voice</text>
  </g>
  <line x1="488" y1="408" x2="840" y2="408" stroke="#a7f3d0" stroke-width="1"/>
  <text x="488" y="424" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="1.2">EXTENDED — BEYOND CLAUDE (EXT MCP API)</text>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0f172a">
    <text x="488" y="448">✉️ Gmail · 💼 LinkedIn · 💬 WhatsApp · 📱 mobile</text>
    <text x="488" y="475">🖥️ VMs · 🐳 containers · 🖱️ desktop · 🐙 GitHub</text>
    <text x="488" y="502">🗄️ data service · 🚚 transfers · nodes · clusters</text>
    <text x="488" y="529">🧩 ext plugins + bundled first-party tools</text>
  </g>

  <!-- ───────────────── Skills card ───────────────── -->
  <rect x="888" y="96" width="352" height="460" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="1.6"/>
  <text x="912" y="130" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#7e22ce">🧩 Skills &amp; plugin</text>
  <text x="912" y="150" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">slash commands + hooks, right in the terminal</text>
  <line x1="912" y1="162" x2="1216" y2="162" stroke="#e9d5ff" stroke-width="1"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0f172a">
    <text x="912" y="188">⚡ /sessions · /projects · /summary · /run</text>
    <text x="912" y="215">👁️ observe skill — “what's running? cost?”</text>
    <text x="912" y="242">🧭 route skill — work goes to the right</text>
    <text x="912" y="260" fill="#475569" font-size="12.5">     session (stay / resume / queue / new)</text>
    <text x="912" y="287">🛠️ /assist-setup · /assist-status</text>
    <text x="912" y="314">🔍 /assist-search — knowledge &amp; prompts</text>
    <text x="912" y="341">🌐 /web · /web-sessions · /web-tasks</text>
    <text x="912" y="368">📎 context-inject hook — past learnings</text>
    <text x="912" y="386" fill="#475569" font-size="12.5">     land in new sessions automatically</text>
    <text x="912" y="413">📟 statusline — cost · context % · limits</text>
  </g>

  <!-- arrows into core -->
  <g stroke="#475569" stroke-width="1.6" fill="none">
    <line x1="240" y1="556" x2="240" y2="608" marker-end="url(#arrow)"/>
    <line x1="640" y1="556" x2="640" y2="608" marker-end="url(#arrow)"/>
    <line x1="1040" y1="556" x2="1040" y2="608" marker-end="url(#arrow)"/>
  </g>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#475569">
    <text x="250" y="588">REST + SSE</text>
    <text x="650" y="580">MCP — local (Claude Code)</text>
    <text x="650" y="594">or via hub (claude.ai)</text>
    <text x="1050" y="588">loopback REST</text>
  </g>

  <!-- core bar -->
  <rect x="40" y="612" width="1200" height="66" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
  <text x="640" y="640" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="16.5" font-weight="700" fill="#0f172a">⚙️ lm-assist Core — session engine · 860+ REST endpoints (the fourth door, for systems) · MCP server · :3100</text>
  <text x="640" y="662" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#475569">reads the session files Claude Code already writes — no external database, no API key required</text>

  <!-- fleet band -->
  <g stroke="#475569" stroke-width="1.6" fill="none">
    <line x1="352" y1="678" x2="352" y2="726" marker-end="url(#arrow)"/>
    <line x1="928" y1="678" x2="928" y2="726" marker-end="url(#arrow)"/>
  </g>
  <text x="362" y="708" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#475569">outbound WebSocket (optional)</text>
  <text x="938" y="708" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#475569">local files + processes</text>

  <rect x="40" y="730" width="624" height="110" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="64" y="760" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="15.5" font-weight="700" fill="#92400e">🌩️ LangMart Hub — optional fleet relay</text>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0f172a">
    <text x="64" y="786">🔑 one-time keypack enrollment for new machines</text>
    <text x="64" y="813">🌍 reach every enrolled node from claude.ai or any browser</text>
  </g>

  <rect x="688" y="730" width="552" height="110" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="712" y="760" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="15.5" font-weight="700" fill="#0f172a">💻 your machines</text>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0f172a">
    <text x="712" y="786">🐧 Linux · 🍎 macOS · 🪟 Windows — one Core per node</text>
    <text x="712" y="813">📂 sessions · 🧠 memory · 🔗 connector browsers live here</text>
  </g>

  <line x1="664" y1="785" x2="686" y2="785" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <text x="640" y="868" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Same Core underneath. Most days start at the MCP door — Claude does the work; the Web UI is where you watch, the terminal is where you type, and systems script the REST API directly.</text>
</svg>
